# Production-shaped stack: php-fpm + nginx for the API, a static nginx build of the
# SPA, and Postgres. Local dev keeps using docker-compose.yml (Postgres only, app run
# natively) — this file is for deploying the whole thing as containers.
#
# Before first run:
#   cp backend/.env.example backend/.env   # then fill in real secrets
#   docker compose -f docker-compose.prod.yml run --rm backend php artisan key:generate
#   docker compose -f docker-compose.prod.yml run --rm backend php artisan migrate --force

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dukani}
      POSTGRES_USER: ${DB_USERNAME:-dukani}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dukani}
    volumes:
      - dukani_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dukani} -d ${DB_DATABASE:-dukani}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - dukani_storage:/var/www/html/storage
    ports:
      - "8001:80"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8001/api/v1}
    restart: unless-stopped
    ports:
      - "8080:80"

volumes:
  dukani_postgres_data:
  dukani_storage:
