openapi: 3.0.3
info:
  title: Dukani API
  description: >
    Multi-tenant POS/inventory/purchasing platform. Generated from the live route
    table (`php artisan route:list`) rather than hand-transcribed, so path/method/
    auth coverage is exhaustive and won't drift out of sync the way a hand-written
    doc would. Request/response bodies are intentionally NOT exhaustively schema'd
    here for the older, larger modules (Products, Purchasing, Sales, etc.) — see each
    module's FormRequest class in app/Http/Requests for the authoritative validation
    rules. The Auth and Platform Admin sections (recently added/changed) do have full
    request schemas below, since those were hand-verified against their controllers.
  version: "1.0.0"
servers:
  - url: /api/v1
    description: Same-origin API (this is how the SPA calls it)
tags:
  - name: Audit
  - name: Auth
  - name: Business / Staff / RBAC
  - name: Customers
  - name: Expenses
  - name: Inventory
  - name: Notifications
  - name: POS / Sales
  - name: Platform Admin
  - name: Products
  - name: Purchasing
  - name: Quotations
  - name: Receipts
  - name: Reports
  - name: Shifts
  - name: Stock Taking
  - name: Stock Transfers
components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      description: Laravel Sanctum personal access token, obtained from /auth/login or /auth/register.
  schemas:
    RegisterPayload:
      type: object
      required: [business_name, owner_name, email, password, password_confirmation]
      properties:
        business_name: { type: string }
        business_category: { type: string, nullable: true }
        owner_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        password: { type: string, minLength: 8 }
        password_confirmation: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
    LoginPayload:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user: { type: object, description: "AuthenticatedUserResource — id, name, email, email_verified_at, roles, permissions, business, ..." }
    ForgotPasswordPayload:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordPayload:
      type: object
      required: [email, token, password, password_confirmation]
      properties:
        email: { type: string, format: email }
        token: { type: string }
        password: { type: string, minLength: 8 }
        password_confirmation: { type: string }
    VerifyEmailPayload:
      type: object
      required: [email, token]
      properties:
        email: { type: string, format: email }
        token: { type: string }
    ExtendLicensePayload:
      type: object
      required: [months]
      properties:
        months: { type: integer, enum: [6, 12] }
    UpdateBusinessStatusPayload:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, suspended] }
    BusinessSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string, nullable: true }
        slug: { type: string }
        currency: { type: string }
        plan: { type: string, nullable: true }
        status: { type: string, enum: [active, suspended] }
        users_count: { type: integer }
        license_expires_at: { type: string, format: date-time, nullable: true }
    BusinessDetail:
      allOf:
        - $ref: '#/components/schemas/BusinessSummary'
        - type: object
          properties:
            timezone: { type: string }
            created_at: { type: string, format: date-time }
            staff_count: { type: integer }
            branches:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  code: { type: string }
                  is_main: { type: boolean }
                  status: { type: string }
            owner:
              type: object
              nullable: true
              properties:
                name: { type: string }
                email: { type: string }
                phone: { type: string, nullable: true }
                joined_at: { type: string, format: date-time }
security:
  - sanctum: []
